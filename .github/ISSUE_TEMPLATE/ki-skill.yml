name: KI-Skill einreichen
description: Einen Prompt oder ein KI-Tool teilen, das du mit ChatGPT, Claude, Copilot o. Ä. gebaut hast.
title: "KI-Skill: "
labels: ["eingereicht"]
body:
  - type: markdown
    attributes:
      value: |
        Danke fürs Teilen! Eine Moderatorin schaut die Einreichung an. Sobald sie freigegeben ist, erscheint der Skill automatisch in der Toolbox.

        **Bitte keine persönlichen Daten, Passwörter oder vertraulichen Inhalte in den Prompt schreiben.**
  - type: input
    id: name
    attributes:
      label: Name
      placeholder: z. B. Feedback-Coach für Texte
    validations:
      required: true
  - type: dropdown
    id: plattform
    attributes:
      label: Plattform
      description: Für welches KI-Tool hast du den Skill gebaut?
      options:
        - ChatGPT
        - Claude
        - Microsoft Copilot
        - Gemini
        - Mehrere / andere
    validations:
      required: true
  - type: dropdown
    id: kategorie
    attributes:
      label: Kategorie
      options:
        - KI & Recherche
        - Design & Bild
        - Text & Dokumente
        - Audio & Video
        - Barrierefreiheit
        - Produktivität
        - Dateien
    validations:
      required: true
  - type: input
    id: beschreibung
    attributes:
      label: Kurzbeschreibung
      description: Ein Satz, der erklärt, was der Skill macht.
    validations:
      required: true
  - type: textarea
    id: einsatz
    attributes:
      label: Wofür hast du es verwendet?
      description: Beschreibe kurz deinen Anwendungsfall.
    validations:
      required: true
  - type: textarea
    id: weitere
    attributes:
      label: Wo könnte man es sonst noch einsetzen?
      description: Ideen für andere Situationen, Fächer oder Berufe.
  - type: input
    id: tags
    attributes:
      label: Schlagwörter
      description: Mit Komma getrennt.
      placeholder: z. B. Feedback, Schreiben
  - type: input
    id: von
    attributes:
      label: Erstellt von
      description: Dein Name oder Vorname, so wie er in der Toolbox stehen soll.
  - type: textarea
    id: prompt
    attributes:
      label: Prompt / Anweisungen
      description: Füge den Prompt oder die Anweisungen genau so ein, wie du sie verwendest. Markdown ist erlaubt.
    validations:
      required: true

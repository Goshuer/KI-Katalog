name: Web-Tool empfehlen
description: Eine Website, App oder Browser-Erweiterung empfehlen, die dir bei der Arbeit hilft.
title: "Web-Tool: "
labels: ["eingereicht"]
body:
  - type: markdown
    attributes:
      value: Danke für die Empfehlung! Eine Moderatorin schaut sie an. Sobald sie freigegeben ist, erscheint das Tool automatisch in der Toolbox.
  - type: input
    id: name
    attributes:
      label: Name
      placeholder: z. B. NotebookLM
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Website-Link
      placeholder: https://…
  - type: dropdown
    id: kategorie
    attributes:
      label: Kategorie
      options:
        - KI & Recherche
        - Design & Bild
        - Text & Dokumente
        - Audio & Video
        - Barrierefreiheit
        - Produktivität
        - Dateien
    validations:
      required: true
  - type: dropdown
    id: plattform
    attributes:
      label: Plattform
      options:
        - Web
        - Browser-Erweiterung
        - App & Browser
        - macOS
        - Windows
        - Desktop
        - Smartphone
        - Andere
  - type: input
    id: beschreibung
    attributes:
      label: "Das Tool ist für …"
      description: Ein Satz, wofür das Tool gut ist.
    validations:
      required: true
  - type: textarea
    id: funktion
    attributes:
      label: "Es funktioniert so …"
      description: Ein konkreter Tipp, wie man es einsetzt.
    validations:
      required: true
  - type: textarea
    id: weitere
    attributes:
      label: "Man könnte es auch brauchen für …"
      description: Ideen für andere Situationen, Fächer oder Berufe.
  - type: input
    id: tags
    attributes:
      label: Schlagwörter
      description: Mit Komma getrennt.
  - type: input
    id: von
    attributes:
      label: Empfohlen von
      description: Dein Name oder Vorname.

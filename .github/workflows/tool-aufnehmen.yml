name: Tool aufnehmen

# Läuft, sobald jemand mit Schreibrechten das Label "freigegeben" an ein Issue hängt.
# Nur Moderator:innen (Personen mit Schreibrechten im Repository) können Labels setzen.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: tool-aufnehmen
  cancel-in-progress: false

jobs:
  aufnehmen:
    if: github.event.label.name == 'freigegeben'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Datei aus dem Issue erstellen
        id: tool
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/issue-to-eintrag.mjs

      - name: Ins Repository übernehmen
        env:
          DATEI: ${{ steps.tool.outputs.datei }}
          TITEL: ${{ steps.tool.outputs.titel }}
          NR: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DATEI"
          git commit -m "Neu: $TITEL (#$NR)"
          git push

      - name: Issue schliessen
        env:
          GH_TOKEN: ${{ github.token }}
          NR: ${{ github.event.issue.number }}
        run: |
          gh issue close "$NR" --repo "$GITHUB_REPOSITORY" \
            --comment "Danke! Der Eintrag ist aufgenommen und erscheint in ein bis zwei Minuten in der Toolbox."

      - name: Bei Fehler im Issue melden
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          NR: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NR" --repo "$GITHUB_REPOSITORY" \
            --body "Der Eintrag konnte nicht automatisch aufgenommen werden. Bitte prüft, ob alle Pflichtfelder ausgefüllt sind (Details unter «Actions»)."

  veroeffentlichen:
    needs: aufnehmen
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
